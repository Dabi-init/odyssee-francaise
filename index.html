<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#090d1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest?v=24.0">
  <link rel="icon" type="image/png" href="assets/odyssee_icon.png?v=24.0">
  <link rel="apple-touch-icon" href="assets/odyssee_icon.png?v=24.0">
  <title>L'Odyssée Française — from zero to native French</title>
  <link rel="stylesheet" href="styles.css?v=24.0">
  <link rel="stylesheet" href="v12.css?v=24.0">
  <link rel="stylesheet" href="sound_lab.css?v=24.0">
  <link rel="stylesheet" href="chemin.css?v=24.0">
</head>
<body class="rpg-body">
  <!-- Global Particle & Floating Combat Text Overlay Canvas -->
  <canvas id="vfx-canvas"></canvas>

  <!-- Achievement & Level-Up Toast Stack -->
  <div id="toast-stack" class="toast-stack"></div>

  <!-- Top RPG Game HUD Bar (Hidden on Title Screen, Shown in Game) -->
  <header id="game-hud" class="rpg-hud">
    <!-- Left: Hero Avatar, Rank, Level, HP & XP Bars -->
    <div class="hud-hero-cluster" onclick="window.navigateScene('title')" title="Return to Title Screen">
      <div class="hero-portrait-frame">
        <span class="hero-avatar-icon">⚔️</span>
        <span class="hero-level-badge" id="hud-level">Lv.1</span>
      </div>
      <div class="hero-vitals">
        <div class="hero-name-row">
          <span class="hero-rank-title" id="hud-rank">🌱 Apprenti A1</span>
          <span class="hero-streak-pill" id="hud-streak">🔥 1d</span>
        </div>
        <div class="vital-bars-row">
          <div class="vital-bar xp-bar" title="Experience Points">
            <div class="vital-fill xp-fill" id="hud-xp-bar" style="width:20%"></div>
            <span class="vital-label" id="hud-xp">0 XP</span>
          </div>
          <div class="vital-bar mastery-bar" title="Stages cleared across all worlds">
            <div class="vital-fill mastery-fill" id="hud-mastery-bar" style="width:2%"></div>
            <span class="vital-label" id="hud-mastered">⭐ 0/496 Stages</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Center: Current World & Active Stage Indicator -->
    <div class="hud-realm-banner" id="hud-realm-banner" onclick="window.navigateScene('worldmap')">
      <span class="realm-icon">🗺️</span>
      <div>
        <div class="realm-label">ACTIVE CAMPAIGN STAGE</div>
        <div class="realm-title" id="hud-active-chapter">World 01 • Stage 1-1 (A1)</div>
      </div>
    </div>

    <!-- Right: RPG Medallion Action Wheel & Gold Purse -->
    <div class="hud-medallion-bar">
      <button class="rpg-medallion continue-med" onclick="window.continueJourney()" title="Continue your journey: the game picks warm-up reviews, the next stage, or a story scene">
        <span class="med-icon">▶️</span>
        <span class="med-text">Continuer</span>
      </button>
      <button class="rpg-medallion" data-scene="salon" onclick="window.navigateScene('salon')" title="Le Salon: talk with an AI French partner (speak or type, with corrections)">
        <span class="med-icon">🗣️</span>
        <span class="med-text">Le Salon</span>
      </button>
      <button class="rpg-medallion" data-scene="grammar" onclick="window.navigateScene('grammar')" title="Ma Grammaire: every rule of the course, searchable">
        <span class="med-icon">📘</span>
        <span class="med-text">Grammaire</span>
      </button>
      <button class="rpg-medallion" data-scene="soundlab" onclick="window.navigateScene('soundlab')" title="Le Labo des Sons: pronunciation lab">
        <span class="med-icon">👄</span>
        <span class="med-text">Sons</span>
      </button>
      <button class="rpg-medallion" data-scene="gym" onclick="window.navigateScene('gym')" title="La Salle du Natif: Native Gym">
        <span class="med-icon">🧠</span>
        <span class="med-text">Gym</span>
      </button>
      <button class="rpg-medallion more-med" onclick="window.toggleAllMenus()" title="Show all game modes">
        <span class="med-icon">⋯</span>
        <span class="med-text">More</span>
      </button>
      <button class="rpg-medallion" data-adv="1" data-scene="radio" onclick="window.navigateScene('radio')" title="Radio Paris: real French podcasts, radio and séries">
        <span class="med-icon">📻</span>
        <span class="med-text">Radio</span>
      </button>
      <button class="rpg-medallion" data-scene="worldmap" onclick="window.navigateScene('worldmap')" title="World map: 62 worlds you can zoom and drag">
        <span class="med-icon">🗺️</span>
        <span class="med-text">62 Worlds</span>
      </button>
      <button class="rpg-medallion" data-scene="academy" onclick="window.navigateScene('academy')" title="Play the current stage: lesson, phrases, practice, duel">
        <span class="med-icon">🎮</span>
        <span class="med-text">Play Stage</span>
      </button>
      <button class="rpg-medallion" data-adv="1" data-scene="battle" onclick="window.navigateScene('battle')" title="2D Canvas Turn-Based Boss Battle Arena">
        <span class="med-icon">⚔️</span>
        <span class="med-text">Boss Arena</span>
      </button>
      <button class="rpg-medallion" data-adv="1" data-scene="cafe" onclick="window.navigateScene('cafe')" title="Le Café de Paris — Visual Novel Dialogue Roleplay">
        <span class="med-icon">☕</span>
        <span class="med-text">Le Café</span>
      </button>
      <button class="rpg-medallion" data-adv="1" data-scene="paris_sim" onclick="window.navigateScene('paris_sim')" title="Vie à Paris — Rockstar Open-World Parisian District Simulator (3 Registers: Familier, Courant, Soutenu)">
        <span class="med-icon">🏙️</span>
        <span class="med-text">Vie à Paris</span>
      </button>
      <button class="rpg-medallion" data-adv="1" data-scene="writing" onclick="window.navigateScene('writing')" title="L'Atelier d'Écriture & DALF C2 Writing Grader (12 Missions + 12-Metric Rubric)">
        <span class="med-icon">✍️</span>
        <span class="med-text">Atelier C2</span>
      </button>
      <button class="rpg-medallion" data-scene="grimoire" onclick="window.navigateScene('grimoire')" title="Grimoire des Erreurs & FSRS-5 Memory Deck (<3s Réflexe Natif)">
        <span class="med-icon">📕</span>
        <span class="med-text">Grimoire</span>
      </button>
      <button class="rpg-medallion" data-adv="1" data-scene="forge" onclick="window.navigateScene('forge')" title="La Grande Forge — 94 Verbs & 11 Tenses Blacksmith">
        <span class="med-icon">⚒️</span>
        <span class="med-text">94 Verbs</span>
      </button>
      <button class="rpg-medallion" data-adv="1" data-scene="codex" onclick="window.navigateScene('codex')" title="Royal Codex — 53 Vocab Themes, 10,854 Cards & DALF C2 Oral Jury">
        <span class="med-icon">📜</span>
        <span class="med-text">Codex & C2</span>
      </button>
      <button class="rpg-medallion gold-purse" data-scene="shop" onclick="window.navigateScene('shop')" title="Boutique de Lumière — Relics, Perks & Trophies">
        <span class="med-icon">🪙</span>
        <span class="med-text" id="hud-gold">150 Gold</span>
      </button>
      <button class="rpg-medallion sfx-btn" onclick="window.toggleRpgMute(this)" title="Toggle Game Synth Audio & SFX">
        <span class="med-icon" id="hud-sfx-icon">🔊</span>
        <span class="med-text">Audio</span>
      </button>
    </div>
  </header>

  <!-- Full-Screen Dynamic Game Stage -->
  <main id="app-main" class="rpg-viewport">
    <div class="loading-crest">Awakening L'Odyssée Française...</div>
  </main>

  <script src="course_data.js?v=24.0"></script>
  <script src="card_align.js?v=24.0"></script>
  <script src="data_fixes.js?v=24.0"></script>
  <script src="native_worlds.js?v=24.0"></script>
  <script src="academie_worlds.js?v=24.0"></script>
  <script src="gym_data.js?v=24.0"></script>
  <script src="gym_extra.js?v=24.0"></script>
  <script src="native_gym.js?v=24.0"></script>
  <script src="tutor_lessons.js?v=24.0"></script>
  <script src="tutor.js?v=24.0"></script>
  <script src="sound_lab_data.js?v=24.0"></script>
  <script src="sound_lab.js?v=24.0"></script>
  <script src="paris_c2_systems.js?v=24.0"></script>
  <script src="radio_data.js?v=24.0"></script>
  <script src="aaa_combat.js?v=24.0"></script>
  <script src="exams_data.js?v=24.0"></script>
  <script src="missions_data.js?v=24.0"></script>
  <script src="save_data.js?v=24.0"></script>
  <script src="app.js?v=24.0"></script>
  <script src="chemin.js?v=24.0"></script>
  <div id="odyssee-version" title="Latest build — if you see this label, you are playing the newest version" style="position:fixed;right:10px;bottom:8px;z-index:9999;font:600 11px/1.2 system-ui,sans-serif;color:#e9d8a6;background:rgba(10,14,30,.72);border:1px solid rgba(233,216,166,.35);padding:4px 8px;border-radius:10px;pointer-events:none">L'Odyssée v24.0 · Édition Privée Tablette Redmi Pad 2 Pro 5G, Clavier Français &amp; Sync Cloud</div>
  <script>
    window.ODYSSEE_VERSION = "v24.0 · Édition Privée Tablette Redmi Pad 2 Pro 5G, Clavier Français & Sync Cloud";
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js?v=24.0").catch(() => {});
      });
    }
  </script>
</body>
</html>
